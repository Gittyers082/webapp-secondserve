name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  frontend-checks:
    name: Frontend (Lint, Type Check & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Astro & TypeScript checks
        run: npx astro check

      - name: Run linter (if configured in package.json)
        run: npm run lint --if-present

      - name: Build production bundle
        run: npm run build

  backend-checks:
    name: Backend (Lint, Type Check & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for backend directory
        id: check_backend
        run: |
          if [ -d "backend" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check_backend.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff mypy pytest httpx

      - name: Lint with Ruff
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: ruff check .

      - name: Type check with Mypy
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: mypy . --ignore-missing-imports

      - name: Run Pytest
        if: always() && steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        env:
          ENVIRONMENT: test
        run: pytest -v